name: Build Android & publish APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Build web UI
        run: |
          npm ci --prefix web
          npm run build

      - name: Install Android deps
        run: npm ci --prefix mobile

      - name: Sync web UI into Android project
        run: npx cap sync android
        working-directory: mobile

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
        working-directory: mobile/android

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Chordless-android-apk
          path: mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish APK to GitHub Release (on tags)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: mobile/android/app/build/outputs/apk/debug/*.apk
          name: Chordless ${{ github.ref_name }}
