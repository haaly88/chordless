name: Build Android & publish APK

on:
  # Build (artifact only) on every push to main so iterations can be tested.
  # Publishing to GitHub Release happens on tag pushes only.
  push:
    tags: ['v*']
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Android APK (native)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle (cached distribution + deps)
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Build debug APK (native, with retries)
        run: |
          chmod +x gradlew
          attempt=1
          until ./gradlew assembleDebug; do
            echo "Build failed (attempt $attempt) — retrying in 10s"
            attempt=$((attempt+1))
            if [ $attempt -gt 3 ]; then
              echo "Build failed after 3 attempts"
              exit 1
            fi
            sleep 10
          done
        working-directory: mobile/android

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Chordless-android-apk
          path: mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish APK to GitHub Release (on tags)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: mobile/android/app/build/outputs/apk/debug/*.apk
          name: Chordless ${{ github.ref_name }}
