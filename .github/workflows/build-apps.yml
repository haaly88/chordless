name: Build apps & publish releases

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-mac:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Apple Silicon (arm64), runner: macos-15, arch: arm64 }
          - { name: Intel (x64), runner: macos-15-intel, arch: x64 }
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Build web UI
        shell: bash
        run: |
          npm ci --prefix web --fetch-retries=5 --fetch-retry-mintimeout=20000
          npm run build

      - name: Install root deps (server — bundled into the app)
        shell: bash
        run: |
          attempt=1
          until npm ci --fetch-retries=5 --fetch-retry-mintimeout=20000; do
            echo "root npm ci attempt $attempt failed"
            attempt=$((attempt+1))
            if [ $attempt -gt 3 ]; then exit 1; fi
            sleep 15
          done

      - name: Install desktop deps
        shell: bash
        run: |
          attempt=1
          until npm ci --prefix desktop --fetch-retries=5 --fetch-retry-mintimeout=20000; do
            echo "desktop npm ci attempt $attempt failed"
            attempt=$((attempt+1))
            if [ $attempt -gt 3 ]; then exit 1; fi
            sleep 15
          done

      - name: Regenerate icons
        run: |
          node desktop/scripts/make-ico.cjs
          node desktop/scripts/make-icns.cjs

      - name: Fetch bundled yt-dlp (macOS)
        run: |
          mkdir -p desktop/build/yt-dlp
          curl -L --fail --retry 10 --retry-delay 15 --retry-all-errors -o desktop/build/yt-dlp/yt-dlp_macos https://github.com/yt-dlp/yt-dlp/releases/download/2026.10.26/yt-dlp_macos
          chmod +x desktop/build/yt-dlp/yt-dlp_macos

      - name: Build macOS targets
        working-directory: desktop
        run: npx electron-builder --mac dmg zip --x64 --arm64 --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Chordless-mac-${{ matrix.name }}-${{ matrix.arch }}
          path: |
            desktop/release/*.dmg
            desktop/release/*.zip
          if-no-files-found: error

      - name: Publish to GitHub Release (on tags)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/release/*.dmg
            desktop/release/*.zip
          name: Chordless ${{ github.ref_name }}

  build-windows:
    name: Windows (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Build web UI
        shell: bash
        run: |
          npm ci --prefix web --fetch-retries=5 --fetch-retry-mintimeout=20000
          npm run build

      - name: Install root deps (server — bundled into the app)
        shell: bash
        run: |
          attempt=1
          until npm ci --fetch-retries=5 --fetch-retry-mintimeout=20000; do
            echo "root npm ci attempt $attempt failed"
            attempt=$((attempt+1))
            if [ $attempt -gt 3 ]; then exit 1; fi
            sleep 15
          done

      - name: Install desktop deps
        shell: bash
        run: |
          attempt=1
          until npm ci --prefix desktop --fetch-retries=5 --fetch-retry-mintimeout=20000; do
            echo "desktop npm ci attempt $attempt failed"
            attempt=$((attempt+1))
            if [ $attempt -gt 3 ]; then exit 1; fi
            sleep 15
          done

      - name: Regenerate icons
        run: |
          node desktop/scripts/make-ico.cjs
          node desktop/scripts/make-icns.cjs

      - name: Fetch bundled yt-dlp (Windows)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path desktop/build/yt-dlp | Out-Null
          $url = 'https://github.com/yt-dlp/yt-dlp/releases/download/2026.10.26/yt-dlp.exe'
          $out = 'desktop/build/yt-dlp/yt-dlp.exe'
          $attempt = 0
          do {
            $attempt++
            try {
              Invoke-WebRequest -Uri $url -OutFile $out
              break
            } catch {
              Write-Warning "yt-dlp fetch attempt $attempt failed: $($_.Exception.Message)"
              if ($attempt -ge 10) { throw }
              Start-Sleep 15
            }
          } while ($true)

      - name: Build Windows targets
        working-directory: desktop
        run: npx electron-builder --win nsis portable --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Chordless-windows-x64
          path: |
            desktop/release/*.exe
          if-no-files-found: error

      - name: Publish to GitHub Release (on tags)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/release/*.exe
          name: Chordless ${{ github.ref_name }}
