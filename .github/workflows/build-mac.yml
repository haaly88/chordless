name: Build macOS apps

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-mac:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Apple Silicon (arm64), runner: macos-15, arch: arm64 }
          - { name: Intel (x64), runner: macos-15-intel, arch: x64 }
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Build web UI
        run: |
          npm ci --prefix web
          npm run build

      - name: Install desktop deps
        run: npm ci --prefix desktop

      - name: Regenerate icons
        run: |
          node desktop/scripts/make-ico.cjs
          node desktop/scripts/make-icns.cjs

      - name: Build macOS targets
        working-directory: desktop
        run: npx electron-builder --mac dmg zip --x64 --arm64

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Chordless-mac-${{ matrix.name }}-${{ matrix.arch }}
          path: |
            desktop/release/*.dmg
            desktop/release/*.zip
          if-no-files-found: error
