// Chordless native Android — top-level build file.
//
// Repositories are declared for every project (root + :app) so that Gradle can
// resolve Compose/Media3 from Google + Maven Central and NewPipeExtractor from
// JitPack, identically on CI and on a developer machine.

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
    }
}
