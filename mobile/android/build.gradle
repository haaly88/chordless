// Chordless native Android — top-level build file.

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.2.1'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.0.0'
    }
}

configurations.all {
    resolutionStrategy {
        eachDependency {
            if (it.group == 'org.jetbrains.kotlin') {
                it.version = '2.0.0'
            }
        }
    }
}