plugins {
    id 'com.android.application' version '8.2.1'
    id 'org.jetbrains.kotlin.android' version '2.2.10'
    id 'org.jetbrains.kotlin.plugin.compose' version '2.2.10'
}

android {
    namespace "app.chordless.music"
    compileSdk 36
    defaultConfig {
        applicationId "app.chordless.music"
        minSdkVersion 26
        targetSdkVersion 36
        versionCode 1
        versionName "1.1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        compose = true
    }
}

dependencies {
    // Compose
    def composeBom = platform('androidx.compose:compose-bom:2024.09.00')
    implementation composeBom
    androidTestImplementation composeBom
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.activity:activity-compose:1.9.2'
    implementation 'androidx.navigation:navigation-compose:2.8.5'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.4'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.4'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-core'
    implementation 'androidx.compose.material:material-icons-extended'

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

    // Networking + JSON
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    implementation 'org.json:json:20240303'

    // Frosted glass (BitChord parity) — Telegram-style blurred bars
    implementation 'dev.chrisbanes.haze:haze:1.6.10'

    // Palette: dynamic artwork theming (BitChord-style mesh gradient tint)
    implementation 'androidx.palette:palette-ktx:1.0.0'

    // Image loading
    implementation 'io.coil-kt:coil-compose:2.6.0'

    // Preferences / favorites
    implementation 'androidx.datastore:datastore-preferences:1.1.1'

    // Media3 player
    implementation 'androidx.media3:media3-exoplayer:1.11.0'
    implementation 'androidx.media3:media3-session:1.11.0'
    implementation 'androidx.media3:media3-ui:1.11.0'

    // NewPipe extractor (YouTube stream resolution: formats + decipher)
    // Pinned to v0.26.3 — same pin as BitChord: newer 0.26.4 parses the
    // current player JS incorrectly, older 0.24.x is dead on today's player.
    implementation 'com.github.TeamNewPipe:NewPipeExtractor:v0.26.3'

    testImplementation 'junit:junit:4.13.2'
    debugImplementation 'androidx.compose.ui:ui-tooling'
}
