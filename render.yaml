# Render Blueprint — one click deploy of the Chordless web app.
# The deploy button in the README points here.
services:
  - type: web
    name: chordless
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 3001
      # Optional: protect the public URL with HTTP basic auth.
      # Set CHORDLESS_USER / CHORDLESS_PASS as secret env vars in the dashboard.
      - key: CHORDLESS_USER
        sync: false
      - key: CHORDLESS_PASS
        sync: false
